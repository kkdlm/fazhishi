<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>管理后台 · 已锁定</title>
<style>
:root{--bg:#151311;--card:#1F1B17;--ink:#EDE4D2;--dim:#8A8073;--line:#33291F;--accent:#C1502E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
 color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--dim)}
h1{font-size:20px;margin:8px 0 6px;font-weight:700}
p{font-size:13px;line-height:1.7;color:var(--dim);margin:0 0 16px}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#141110;
 color:var(--ink);font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;padding:0;height:48px;border:0;border-radius:10px;background:var(--accent);
 color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:18px;font-size:12.5px;color:#D8693F;margin-top:10px}
.hint{font-size:11.5px;color:#6B6257;margin-top:14px;line-height:1.6}
.rem{display:flex;gap:9px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none}
#rem{width:auto;flex:0 0 auto;margin:0;accent-color:var(--accent)}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4EEE0;
 -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
</style>
</head>
<body>
<div class="box" id="gate">
  <div class="eyebrow">法制史一点通</div>
  <h1>管理后台</h1>
  <p>页面内容已加密，输入一次口令后解锁。</p>
  <input id="pwd" type="password" autocomplete="current-password" placeholder="口令" autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked><span>记住口令：这台设备下次自动进入</span></label>
  <button id="go">解锁</button>
  <div class="msg" id="msg"></div>
  <div class="hint">口令只存在这台设备的浏览器里，换设备或清了缓存要再输一次；进入后仍需用管理员账号登录，数据读取由数据库权限控制。</div>
</div>

const SUB=210000;
function b64ToBuf(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}
async function derive(pw,salt){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:SUB,hash:'SHA-256'},
    raw,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const all=new Uint8Array(b64ToBuf(BLOB));
  const salt=all.slice(0,16), iv=all.slice(16,28), ct=all.slice(28);
  const key=await derive(pw,salt);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  /* 明文是 gzip 压过的，解压再交给页面 */
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('gzip');
    const buf=await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    return buf;
  }
  return new TextDecoder().decode(plain);
}
/* 整段包进 IIFE：document.write 接管页面后全局会残留，避免和后台脚本的 LS / enter 撞名 */
(function(){
const LS='fzs.admin.pw';
function saved(){ try{ return localStorage.getItem(LS)||''; }catch(e){ return ''; } }
function remember(v){ try{ if(v) localStorage.setItem(LS,v); else localStorage.removeItem(LS); }catch(e){} }
async function enter(pw){
  const html=await unlock(pw);
  /* 直接接管整页：iOS 全屏下用 fixed iframe 会整体下坠、顶部留一大片空白 */
  document.open();
  document.write(html);
  document.close();
}
const goBtn=document.getElementById('go'), msgEl=document.getElementById('msg');
document.getElementById('go').addEventListener('click',async ()=>{
  const pw=document.getElementById('pwd').value.trim();
  if(!pw){msgEl.textContent='请输入口令';return;}
  const keep=document.getElementById('rem').checked;
  goBtn.disabled=true; msgEl.textContent='解锁中…';
  try{
    remember(keep?pw:'');
    await enter(pw);
  }catch(e){
    remember('');
    msgEl.textContent='口令不对，或浏览器不支持解密（请用较新的 Safari / Chrome）';
    goBtn.disabled=false;
  }
});
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')goBtn.click();});
/* 上次记过口令就直接进，不用再输 */
(function auto(){
  const pw=saved();
  if(!pw) return;
  goBtn.disabled=true; msgEl.textContent='正在进入…';
  enter(pw).catch(()=>{
    remember('');
    goBtn.disabled=false; msgEl.textContent='上次记住的口令失效了，重新输一次';
    const i=document.getElementById('pwd'); if(i){ i.value=''; i.focus(); }
  });
})();
})();
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
