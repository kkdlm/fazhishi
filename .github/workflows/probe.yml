name: probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp
        run: |
          set -e
          date -u '+%Y-%m-%dT%H:%M:%SZ' > probe.txt
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add probe.txt
          git commit -m "probe: $(date -u +%s)"
          git push
