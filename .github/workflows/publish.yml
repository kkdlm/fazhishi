name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download single-file app
        env:
          SRC: https://aka.doubaocdn.com/s/CY7OceFfhm
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 --retry-delay 2 -o index.html "$SRC"
          size=$(stat -c%s index.html)
          echo "index-size=$size"
          if [ "$size" -lt 300000 ]; then echo "::error::too small ($size)"; exit 1; fi
          head -c 60 index.html | grep -q "<!DOCTYPE html>" || { echo "::error::not html"; exit 1; }
          test $(grep -c 'rel="apple-touch-icon' index.html) -ge 4 || { echo "::error::touch icons missing"; exit 1; }
          test $(grep -c 'apple-touch-startup-image' index.html) -ge 3 || { echo "::error::startup images missing"; exit 1; }
          grep -q "VER='3.4.0'" index.html || { echo "::error::version marker not found"; exit 1; }
          grep -q "const PATCH='6'" index.html || { echo "::error::patch marker not 6"; exit 1; }
          grep -q "apple-mobile-web-app-title\" content=\"法制史一点通\"" index.html || { echo "::error::ios app title missing"; exit 1; }
          grep -q "SB_URL='https://lbykbafnkhwxqtfuaoio.supabase.co'" index.html || { echo "::error::supabase url missing"; exit 1; }
          grep -q "sb_publishable_" index.html || { echo "::error::supabase key missing"; exit 1; }
          grep -q "github.com/kkdlm/fazhishi/issues" index.html || { echo "::error::issue repo not renamed"; exit 1; }
          grep -q "kkdlm.github.io/fazhishi<" index.html || { echo "::error::in-app url hint not renamed"; exit 1; }
          grep -q "<title>法制史一点通</title>" index.html || { echo "::error::app title mismatch"; exit 1; }
          v=$(grep -o "VER='[0-9.]*'" index.html | head -1 | sed "s/VER='//;s/'//")
          echo "VER=$v" >> "$GITHUB_ENV"
          p=$(grep -o "const PATCH='[0-9]*'" index.html | head -1 | sed "s/const PATCH='//;s/'//")
          echo "PATCH=${p:-0}" >> "$GITHUB_ENV"

      - name: Download admin console (encrypted loader)
        run: |
          set -euo pipefail
          mkdir -p admin
          curl -fsSL --retry 3 -o admin/index.html "https://aka.doubaocdn.com/s/tTLYVxNm4T"
          size=$(stat -c%s admin/index.html)
          echo "admin-size=$size"
          if [ "$size" -lt 20000 ]; then echo "::error::admin too small ($size)"; exit 1; fi
          grep -q "noindex" admin/index.html || { echo "::error::admin noindex missing"; exit 1; }
          grep -q "管理后台 · 已锁定" admin/index.html || { echo "::error::admin gate missing"; exit 1; }
          grep -q "const BLOB=" admin/index.html || { echo "::error::admin payload missing"; exit 1; }
          if grep -q "sb_publishable_" admin/index.html; then echo "::error::admin must not contain plaintext key"; exit 1; fi

      - name: Download images bundle and unpack
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o img.tar.gz "https://aka.doubaocdn.com/s/GSZr2VQ8mA"
          rm -rf img && tar xzf img.tar.gz
          n=$(ls -1 img | wc -l)
          echo "images=$n"
          if [ "$n" -lt 80 ]; then echo "::error::images missing ($n)"; exit 1; fi
          du -sh img

      - name: Download icons, startup images, manifest, sw
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o apple-touch-icon.png "https://aka.doubaocdn.com/s/MMkHSpL58d"
          curl -fsSL --retry 3 -o icon-192.png "https://aka.doubaocdn.com/s/wN2B51yuN0"
          curl -fsSL --retry 3 -o icon-512.png "https://aka.doubaocdn.com/s/JkPVJKcpEn"
          curl -fsSL --retry 3 -o manifest.webmanifest "https://aka.doubaocdn.com/s/lEaA9jHkfg"
          python3 - <<'PY'
import json
m = json.load(open('manifest.webmanifest', encoding='utf-8'))
assert m.get('name') == '法制史一点通', f"manifest name wrong: {m.get('name')}"
assert m.get('short_name') == '法制史一点通', f"manifest short_name wrong: {m.get('short_name')}"
print('manifest ok:', m['name'], '/', m['short_name'])
PY
          curl -fsSL --retry 3 -o startup-1290x2796.png "https://aka.doubaocdn.com/s/rWrQ3pW04j"
          curl -fsSL --retry 3 -o startup-1179x2556.png "https://aka.doubaocdn.com/s/YtMWhoiMyG"
          curl -fsSL --retry 3 -o startup-1170x2532.png "https://aka.doubaocdn.com/s/s3q9SNSEBy"
          curl -fsSL --retry 3 -o sw.js "https://aka.doubaocdn.com/s/jEtDfFJZH7"
          grep -q "app-3.4.0-p6" sw.js || { echo "::error::sw stale"; exit 1; }
          node --check sw.js

      - name: Drop legacy data dir
        run: |
          if [ -d data ]; then git rm -r --quiet data; echo "removed legacy data/"; else echo "no legacy data/"; fi

      - name: Generate version.json (auto, always in sync with index.html)
        run: |
          set -euo pipefail
          printf '{\n  "version": "%s",\n  "patch": %s,\n  "date": "%s"\n}\n' \
            "$VER" "${PATCH:-0}" "$(date -u +%Y-%m-%d)" > version.json
          cat version.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "kkdlm"
          git config user.email "63939444+kkdlm@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "chore: 法制史 v${VER} 发布（补丁 ${PATCH:-0}）+ version.json 自动同步"
            git push origin HEAD:main
          fi

      - name: Enable GitHub Pages (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/pages" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"main","path":"/"}}' || echo 000)
          echo "POST pages -> $code"
          exit 0
