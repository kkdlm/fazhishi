name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download single-file app
        env:
          SRC: https://aka.doubaocdn.com/s/ldFpZkrVM6
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 --retry-delay 2 -o index.html "$SRC"
          size=$(stat -c%s index.html)
          echo "index-size=$size"
          if [ "$size" -lt 300000 ]; then echo "::error::too small ($size)"; exit 1; fi
          head -c 60 index.html | grep -q "<!DOCTYPE html>" || { echo "::error::not html"; exit 1; }
          test $(grep -c 'rel="apple-touch-icon' index.html) -ge 4 || { echo "::error::touch icons missing"; exit 1; }
          test $(grep -c 'apple-touch-startup-image' index.html) -ge 3 || { echo "::error::startup images missing"; exit 1; }
          grep -q "VER='3.5.0'" index.html || { echo "::error::version marker not found"; exit 1; }
          grep -q "const PATCH='15'" index.html || { echo "::error::patch marker not 15"; exit 1; }
          grep -q '"apple-mobile-web-app-title" content="法制史一点通"' index.html || { echo "::error::ios app title missing"; exit 1; }
          grep -q "SB_URL='https://lbykbafnkhwxqtfuaoio.supabase.co'" index.html || { echo "::error::supabase url missing"; exit 1; }
          grep -q "sb_publishable_" index.html || { echo "::error::supabase key missing"; exit 1; }
          grep -q "github.com/kkdlm/fazhishi/issues" index.html || { echo "::error::issue repo not renamed"; exit 1; }
          grep -q "kkdlm.github.io/fazhishi<" index.html || { echo "::error::in-app url hint not renamed"; exit 1; }
          grep -q "<title>法制史一点通</title>" index.html || { echo "::error::app title mismatch"; exit 1; }
          grep -q "一是指周朝制定的九篇刑书" index.html || { echo "::error::西周九刑条缺失"; exit 1; }
          grep -q "三司会审" index.html || { echo "::error::标题层级修复缺失"; exit 1; }
          grep -q "一夫一妻制婚姻原则" index.html || { echo "::error::婚姻标题首字缺失"; exit 1; }
          grep -q "五权宪法的政府组织方案" index.html || { echo "::error::五权宪法标题缺字"; exit 1; }
          grep -q "ksec" index.html || { echo "::error::知识点分块渲染缺失"; exit 1; }
          grep -q "function legendHTML" index.html || { echo "::error::看板图例缺失"; exit 1; }
          grep -q 'id="splash"' index.html || { echo "::error::页内启动页缺失"; exit 1; }
          grep -q 'class="splash-slips"' index.html || { echo "::error::启动页简牍缺失"; exit 1; }
          grep -q 'class="splash-seal"' index.html || { echo "::error::启动页印章缺失"; exit 1; }
          grep -q 'animation:slipIn' index.html || { echo "::error::启动页动效缺失"; exit 1; }
          grep -q 'animation:splashFade' index.html || { echo "::error::启动页文字淡入缺失"; exit 1; }
          grep -q '.cb{color:var(--cc-b)}' index.html || { echo "::error::正文标色未恢复"; exit 1; }
          grep -q '.co{color:var(--cc-o)}' index.html || { echo "::error::正文标色未恢复(橙)"; exit 1; }
          grep -q '.cgr{color:var(--cc-gr)}' index.html || { echo "::error::正文标色未恢复(绿)"; exit 1; }
          grep -q ".bt{background:color-mix" index.html || { echo "::error::背诵提示样式缺失"; exit 1; }
          grep -q "function btCardHTML" index.html || { echo "::error::背诵提示渲染缺失"; exit 1; }
          grep -q "背诵一本通" index.html || { echo "::error::背诵提示来源缺失"; exit 1; }
          grep -q "复盘背诵" index.html || { echo "::error::整节复盘提示缺失"; exit 1; }
          v=$(grep -o "VER='[0-9.]*'" index.html | head -1 | sed "s/VER='//;s/'//")
          echo "VER=$v" >> "$GITHUB_ENV"
          p=$(grep -o "const PATCH='[0-9]*'" index.html | head -1 | sed "s/const PATCH='//;s/'//")
          echo "PATCH=${p:-0}" >> "$GITHUB_ENV"

      - name: Download admin console (encrypted loader)
        run: |
          set -euo pipefail
          mkdir -p admin
          curl -fsSL --retry 3 -o admin/index.html "https://aka.doubaocdn.com/s/YgWQD3jRve"
          size=$(stat -c%s admin/index.html)
          echo "admin-size=$size"
          if [ "$size" -lt 20000 ]; then echo "::error::admin too small ($size)"; exit 1; fi
          grep -q "noindex" admin/index.html || { echo "::error::admin noindex missing"; exit 1; }
          grep -q "管理后台 · 已锁定" admin/index.html || { echo "::error::admin gate missing"; exit 1; }
          grep -q "const BLOB=" admin/index.html || { echo "::error::admin payload missing"; exit 1; }
          if grep -q "sb_publishable_" admin/index.html; then echo "::error::admin must not contain plaintext key"; exit 1; fi

      - name: Download images bundle and unpack
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o img.tar.gz "https://aka.doubaocdn.com/s/GSZr2VQ8mA"
          rm -rf img && tar xzf img.tar.gz
          n=$(ls -1 img | wc -l)
          echo "images=$n"
          if [ "$n" -lt 80 ]; then echo "::error::images missing ($n)"; exit 1; fi
          du -sh img

      - name: Download manifest and check app name
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o manifest.webmanifest "https://aka.doubaocdn.com/s/lEaA9jHkfg"
          python3 -c "import json;m=json.load(open('manifest.webmanifest',encoding='utf-8'));assert m['name']=='法制史一点通',m['name'];assert m['short_name']=='法制史一点通',m['short_name'];print('manifest ok',m['name'],m['short_name'])"

      - name: Download icons, startup images, sw
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o apple-touch-icon.png "https://aka.doubaocdn.com/s/MMkHSpL58d"
          curl -fsSL --retry 3 -o icon-192.png "https://aka.doubaocdn.com/s/wN2B51yuN0"
          curl -fsSL --retry 3 -o icon-512.png "https://aka.doubaocdn.com/s/JkPVJKcpEn"
          curl -fsSL --retry 3 -o startup-1290x2796.png "https://aka.doubaocdn.com/s/JDVDiq07o8"
          curl -fsSL --retry 3 -o startup-1179x2556.png "https://aka.doubaocdn.com/s/tKyR23dyIQ"
          curl -fsSL --retry 3 -o startup-1170x2532.png "https://aka.doubaocdn.com/s/XYAU2RvUgj"
          python3 - <<'PY'
          import struct
          for f,w,h in [('startup-1290x2796.png',1290,2796),('startup-1179x2556.png',1179,2556),('startup-1170x2532.png',1170,2532)]:
              d=open(f,'rb').read(33)
              got=struct.unpack('>II',d[16:24])
              assert got==(w,h),(f,got); print(f,'ok',got)
          PY
          curl -fsSL --retry 3 -o sw.js "https://aka.doubaocdn.com/s/rikWLBCkJx"
          grep -q "app-3.5.0-p15" sw.js || { echo "::error::sw stale"; exit 1; }
          grep -q "/admin/" sw.js || { echo "::error::sw admin bypass missing"; exit 1; }
          node --check sw.js

      - name: Generate version.json (auto, always in sync with index.html)
        run: |
          set -euo pipefail
          printf '{\n  "version": "%s",\n  "patch": %s,\n  "date": "%s"\n}\n' \
            "$VER" "${PATCH:-0}" "$(date -u +%Y-%m-%d)" > version.json
          cat version.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "kkdlm"
          git config user.email "63939444+kkdlm@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "chore: 法制史 v${VER} 发布（补丁 ${PATCH:-0}）+ version.json 自动同步"
            git push origin HEAD:main
          fi

      - name: Enable GitHub Pages (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/pages" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"main","path":"/"}}' || echo 000)
          echo "POST pages -> $code"
          exit 0
