name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download single-file app
        env:
          SRC: https://aka.doubaocdn.com/s/peRYiU9JUL
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 --retry-delay 2 -o index.html "$SRC"
          size=$(stat -c%s index.html)
          echo "size=$size"
          if [ "$size" -lt 4000000 ]; then
            echo "::error::download too small ($size), abort"
            exit 1
          fi
          head -c 60 index.html | grep -q "<!DOCTYPE html>" || { echo "::error::not html"; exit 1; }
          grep -q "VER='3.0'" index.html || echo "::warning::version marker not found"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "kkdlm"
          git config user.email "63939444+kkdlm@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "chore: 同步法制史一图流 v3.0 单文件应用"
            git push origin HEAD:main
          fi

      - name: Enable GitHub Pages (main / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/pages"
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "POST pages -> $code"
          if [ "$code" = "409" ]; then
            echo "Pages already enabled"
          elif [ "$code" -ge 400 ]; then
            cat /tmp/pages.json || true
            echo "::error::failed to enable pages"
            exit 1
          fi
          curl -sS "$api" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("pages url:", d.get("html_url")); print("status:", d.get("status"))' || true
