name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SRC: https://aka.doubaocdn.com/s/nGtcXkbnhR
      SWURL: https://aka.doubaocdn.com/s/4CYynBANym
      PATCH: "39"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: |
          set -e
          curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 300 -o index.new "$SRC"
          sz=$(stat -c%s index.new); echo "index-size=$sz"
          test "$sz" -gt 1500000
          head -c 60 index.new | grep -q '<!DOCTYPE html>'
          grep -q "const PATCH='$PATCH'" index.new
          mv index.new index.html
          curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 -o sw.js "$SWURL"
          grep -q "app-3.7.0-p$PATCH" sw.js
          printf '{\n  "version": "3.7.0",\n  "patch": %s,\n  "date": "2026-11-16"\n}\n' "$PATCH" > version.json
          echo ok

      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html sw.js version.json
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "chore: 法制史 v3.7.0 发布（补丁 $PATCH）+ version.json 自动同步"
          git push
