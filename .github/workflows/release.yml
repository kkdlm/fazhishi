name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SRC: https://aka.doubaocdn.com/s/FuheVsSUJU
      SWURL: https://aka.doubaocdn.com/s/lUg3DXQWQ9
      VER: "3.11.0"
      PATCH: "28"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: |
          set -e
          if ! curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 420 -o index.new "$SRC"; then echo "::notice::源文件暂时拉不到，本次跳过"; exit 0; fi
          sz=$(stat -c%s index.new); echo "index-size=$sz"
          if [ "$sz" -lt 1500000 ]; then echo "::notice::文件过小，跳过"; exit 0; fi
          head -c 60 index.new | grep -q '<!DOCTYPE html>'
          if ! grep -q "const PATCH='$PATCH'" index.new; then echo "::notice::补丁号不匹配，跳过"; exit 0; fi
          mv index.new index.html
          curl -fsSL --http1.1 -L --retry 3 --max-time 120 -o sw.js "$SWURL" || { echo "::notice::sw 拉不到，跳过"; exit 0; }
          grep -q "app-$VER-p$PATCH" sw.js
          printf '{\n  "version": "%s",\n  "patch": %s,\n  "date": "2026-11-19"\n}\n' "$VER" "$PATCH" > version.json
          echo ok

      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html sw.js version.json || true
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "chore: 法制史 v$VER 发布（补丁 $PATCH）"
          git push
