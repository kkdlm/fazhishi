name: release
# 2026-11-25T20:05+08:00 单科 1.2.1.4（读不到云端不盲写）
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VER: "1.2.1.4"
      APPVER: "1.2.1.4"
      SRC: https://aka.doubaocdn.com/s/UoMFMXxqf9
      APPSRC: https://aka.doubaocdn.com/s/1B4d8rTx6Z
      SWURL: https://aka.doubaocdn.com/s/VjEOdy59bj
      ADMSRC: https://aka.doubaocdn.com/s/RGt89vytX7
    steps:
      - name: Check
        run: |
          if ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then echo "::error::版本号必须是四段数字"; exit 1; fi
          if ! echo "$APPVER" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then echo "::error::正文版本号必须是四段数字"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish
        run: |
          set -e
          git pull --rebase --autostash origin main || true
          if ! curl -fsSL --http1.1 -L --retry 3 --retry-all-errors --retry-delay 2 --max-time 150 -o index.new "$SRC"; then echo "::notice::壳文件暂时拉不到，本次跳过"; exit 0; fi
          sz=$(stat -c%s index.new); echo "shell-size=$sz"
          if [ "$sz" -lt 4000 ] || [ "$sz" -gt 400000 ]; then echo "::notice::壳文件大小异常，跳过"; exit 0; fi
          if ! grep -q "VER='$VER'" index.new; then echo "::notice::壳版本不匹配，跳过"; exit 0; fi
          if ! grep -q "VERB='$APPVER'" index.new; then echo "::notice::壳的正文版本号未更新，跳过"; exit 0; fi
          if grep -q "__SHA__" index.new; then
            sed -i "s/__SHA__/$GITHUB_SHA/g" index.new
            echo "shell-sha=$GITHUB_SHA"
          fi
          mv index.new index.html

          if ! curl -fsSL --http1.1 -L --retry 3 --retry-all-errors --retry-delay 2 --max-time 300 -o app.new "$APPSRC"; then echo "::notice::正文暂时拉不到，本次跳过"; exit 0; fi
          asz=$(stat -c%s app.new); echo "app-size=$asz"
          if [ "$asz" -lt 1500000 ]; then echo "::notice::正文字节过小，跳过"; exit 0; fi
          head -c 60 app.new | grep -q '<!DOCTYPE html>'
          if ! grep -q "const VER='$APPVER'" app.new; then echo "::notice::正文版本号不匹配，跳过"; exit 0; fi
          mv app.new app.html
          gzip -9 -c app.html > app.html.gz || true

          if ! curl -fsSL --http1.1 -L --retry 2 --max-time 90 -o sw.js "$SWURL"; then echo "::notice::sw 拉不到，跳过"; exit 0; fi
          if ! grep -q "app-$VER" sw.js; then echo "::notice::sw 版本不匹配，跳过"; exit 0; fi
          if [ "$(stat -c%s sw.js)" -lt 1000 ]; then echo "::notice::sw 为空，跳过"; exit 0; fi

          mkdir -p admin
          if curl -fsSL --http1.1 -L --retry 4 --retry-all-errors --retry-delay 3 --max-time 120 -o admin.new "$ADMSRC"; then
            asz2=$(stat -c%s admin.new); echo "admin-size=$asz2"
            if [ "$asz2" -gt 6000 ] && grep -q 'BLOB=' admin.new; then mv admin.new admin/index.html; else echo "::notice::后台文件异常，保留原样"; fi
          else echo "::notice::后台拉不到，保留原样"; fi

          gz=$(stat -c%s app.html.gz 2>/dev/null || echo 0)
          TODAY=$(TZ=Asia/Shanghai date +%F)
          printf '{"version":"%s","s":%s,"gz":%s,"app":"%s","sha":"%s","date":"%s"}\n' "$APPVER" "$asz" "$gz" "$APPSRC" "$GITHUB_SHA" "$TODAY" > version.json
          echo ok

      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html app.html app.html.gz sw.js version.json admin/index.html || true
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "chore: 法制史 发布 v$VER"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || sleep 5
          done
