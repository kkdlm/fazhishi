name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SRC: https://aka.doubaocdn.com/s/8ObuqfpeW1
      APPSRC: https://aka.doubaocdn.com/s/QQAnsRAlos
      SWURL: https://aka.doubaocdn.com/s/brhNY2qSJr
      ADMSRC: https://aka.doubaocdn.com/s/IxGz47fWod
      VER: "4.0.5"
      PATCH: "8"
    steps:
      - name: Check
        run: |
          if ! echo "$VER" | grep -Eq '^[0-9]\.[0-9]\.[0-9]$'; then echo "::error::版本号必须是 主.次.补丁 各一位（0-9）"; exit 1; fi
          if ! echo "$PATCH" | grep -Eq '^[0-9]$'; then echo "::error::补丁号必须是单一位（0-9）"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish
        run: |
          set -e
          git pull --rebase --autostash origin main || true
          if ! curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 420 -o index.new "$SRC"; then echo "::notice::壳文件暂时拉不到，本次跳过"; exit 0; fi
          sz=$(stat -c%s index.new); echo "shell-size=$sz"
          if [ "$sz" -lt 4000 ] || [ "$sz" -gt 400000 ]; then echo "::notice::壳文件大小异常，跳过"; exit 0; fi
          if ! grep -q "$VER-p$PATCH" index.new; then echo "::notice::壳版本不匹配，跳过"; exit 0; fi
          mv index.new index.html

          if ! curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 600 -o app.new "$APPSRC"; then echo "::notice::正文暂时拉不到，本次跳过"; exit 0; fi
          asz=$(stat -c%s app.new); echo "app-size=$asz"
          if [ "$asz" -lt 1500000 ]; then echo "::notice::正文字节过小，跳过"; exit 0; fi
          head -c 60 app.new | grep -q '<!DOCTYPE html>'
          if ! grep -q "const PATCH='$PATCH'" app.new; then echo "::notice::补丁号不匹配，跳过"; exit 0; fi
          if ! grep -q "const VER='$VER'" app.new; then echo "::notice::正文版本号不匹配，跳过"; exit 0; fi
          mv app.new app.html
          gzip -9 -c app.html > app.html.gz || true

          curl -fsSL --http1.1 -L --retry 3 --max-time 120 -o sw.js "$SWURL" || { echo "::notice::sw 拉不到，跳过"; exit 0; }
          if ! grep -q "app-$VER-p$PATCH" sw.js; then echo "::notice::sw 版本不匹配，跳过"; exit 0; fi
          if [ "$(stat -c%s sw.js)" -lt 1000 ]; then echo "::notice::sw 为空，跳过"; exit 0; fi

          mkdir -p admin
          if curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 300 -o admin.new "$ADMSRC"; then
            asz2=$(stat -c%s admin.new); echo "admin-size=$asz2"
            if [ "$asz2" -gt 6000 ] && grep -q 'BLOB=' admin.new; then mv admin.new admin/index.html; else echo "::notice::后台文件异常，保留原样"; fi
          else echo "::notice::后台拉不到，保留原样"; fi

          gz=$(stat -c%s app.html.gz 2>/dev/null || echo 0)
          printf '{\n  "version": "%s",\n  "patch": %s,\n  "s": %s,\n  "gz": %s,\n  "date": "2026-11-21"\n}\n' "$VER" "$PATCH" "$asz" "$gz" > version.json
          echo ok

      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html app.html app.html.gz sw.js version.json admin/index.html || true
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "chore: 法制史 v$VER 发布（补丁 $PATCH）"
          git pull --rebase --autostash origin main || true
          git push
