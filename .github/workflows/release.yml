name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'admin/**'
      - 'img/**'
      - '*.png'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch app
        run: |
          set -e
          curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 300 -o index.new https://aka.doubaocdn.com/s/nGtcXkbnhR
          sz=$(stat -c%s index.new)
          echo "index-size=$sz"
          test "$sz" -gt 1500000
          head -c 60 index.new | grep -q '<!DOCTYPE html>'
          grep -q "const PATCH='39'" index.new
          grep -q 'class="splash-slips"' index.new
          mv index.new index.html

      - name: Fetch service worker
        run: |
          set -e
          curl -fsSL --http1.1 -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 -o sw.js https://aka.doubaocdn.com/s/4CYynBANym
          grep -q 'app-3.7.0-p39' sw.js
          wc -c sw.js

      - name: Write version
        run: printf '{\n  "version": "3.7.0",\n  "patch": 39,\n  "date": "2026-11-16"\n}\n' > version.json

      - name: Commit
        run: |
          set -e
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html sw.js version.json
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "chore: 法制史 v3.7.0 发布（补丁 39）+ version.json 自动同步"
          git push
