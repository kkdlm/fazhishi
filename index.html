<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="法制史一点通">
<meta name="application-name" content="法制史一点通">
<meta name="theme-color" content="#EAEDE1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232E5344'/%3E%3Ctext x='32' y='44' font-family='Songti SC,serif' font-size='38' fill='%23F3F6EC' text-anchor='middle'%3E%E5%8F%B2%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>法制史一点通</title>
<style>
html,body{margin:0;padding:0;background:#EAEDE1}
#splash{position:fixed;inset:0;z-index:9999;background:#EAEDE1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .42s ease;font-family:"PingFang SC","HarmonyOS Sans SC",system-ui,-apple-system,sans-serif}
#splash.hide{opacity:0;visibility:hidden}
.splash-slips{display:flex;gap:4px;margin-bottom:22px}
.splash-slips i{display:block;width:10px;height:66px;border-radius:3px;background:#F3EEDC;
  box-shadow:inset 0 0 0 1px rgba(60,80,60,.10);animation:slipIn .5s both}
.splash-slips i:nth-child(2){animation-delay:.04s}.splash-slips i:nth-child(3){animation-delay:.08s}
.splash-slips i:nth-child(4){animation-delay:.12s}.splash-slips i:nth-child(5){animation-delay:.16s}
.splash-seal{width:84px;height:84px;border-radius:8px;background:#A5342E;color:#FBF2E3;
  display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600;font-family:"Songti SC",serif;
  animation:splashIn .62s cubic-bezier(.2,.7,.3,1) both}
.splash-title{margin:24px 0 9px;font-size:26px;letter-spacing:.16em;color:#151C17;font-weight:600;font-family:"Songti SC",serif}
.splash-sub{margin:0;font-size:12.5px;letter-spacing:.1em;color:#7C857A}
.splash-strip{margin-top:22px;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.18em;color:#3C6B52;opacity:.8}
.splash-strip s{display:block;width:26px;height:1px;background:#3C6B52;opacity:.45;text-decoration:none}
.sp-bar{width:200px;max-width:62vw;height:3px;border-radius:99px;background:rgba(46,83,68,.15);margin-top:24px;overflow:hidden}
.sp-fill{height:100%;width:0%;border-radius:99px;background:#3C6B52;transition:width .18s linear}
.sp-status{margin:11px 0 0;font-size:10.5px;letter-spacing:.08em;color:#7C857A;min-height:15px}
.sp-pct{margin-left:10px;color:#3C6B52;font-variant-numeric:tabular-nums}
#boot{position:fixed;inset:0;z-index:10001;background:#F6F5F0;color:#22302B;display:none;align-items:center;justify-content:center;
  font:16px/1.75 -apple-system,system-ui,sans-serif;padding:28px}
#boot .in{max-width:420px}
#boot h2{font-size:19px;margin:16px 0 8px}
#boot p{color:#5b6660;margin:0 0 6px}
#boot button{padding:12px 20px;border:0;border-radius:10px;background:#2C4A3E;color:#fff;font-size:15px;margin-top:10px}
#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#EAEDE1}
@keyframes slipIn{from{opacity:0;transform:scaleY(.12) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes splashIn{from{opacity:0;transform:rotate(-4deg) scale(.72)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
</style>
</head>
<body>
<div id="splash">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="splash-slips"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="splash-seal">史</div>
    <h1 class="splash-title">法制史一点通</h1>
    <p class="splash-sub">2027 法硕非法学 · 169 条考点</p>
    <div class="splash-strip"><s></s>断代史 / 专题史 · 背诵一本通<s></s></div>
    <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    <p class="sp-status" id="spStatus">正在连接…<span class="sp-pct" id="spPct"></span></p>
  </div>
</div>
<div id="boot"><div class="in">
  <div style="width:52px;height:52px;border-radius:9px;background:#B4483F;color:#FBF2E3;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600">史</div>
  <h2 id="bootT">页面没加载出来</h2>
  <p id="bootD"></p>
  <button onclick="location.reload()">重新加载</button>
  <button onclick="resetAll()" style="background:#fff;color:#2C4A3E;border:1px solid #C9D2C6;margin-left:8px">清缓存重启</button>
</div></div>
<script>
(function(){
  var VER='3.11.0-p32';
  var fill=document.getElementById('spFill'),pct=document.getElementById('spPct'),
      status=document.getElementById('spStatus'),splash=document.getElementById('splash'),
      boot=document.getElementById('boot');
  var got=0,total=0,lastAt=Date.now(),slow=false,finishing=false,done=false;

  function mb(n){ return (n/1048576).toFixed(2); }
  function paint(){
    var p = total>0 ? Math.min(99, Math.floor(got/total*100)) : (got>0?1:0);
    fill.style.width=p+'%';
    pct.textContent = total>0 ? (p+'% · '+mb(got)+'/'+mb(total)+' MB') : (got>0? (mb(got)+' MB'):'');
  }
  function label(s){ status.firstChild.textContent=s; }
  function fail(t,d,offline){
    boot.style.display='flex';
    document.getElementById('bootT').textContent=t;
    document.getElementById('bootD').textContent=d;
  }
  window.resetAll=function(){
    try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(x){x.unregister();});}); }catch(e){}
    try{ if(window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }catch(e){}
    setTimeout(function(){ location.replace(location.pathname+'?t='+Date.now()); },600);
  };

  /* 慢提示只看「字节有没有前进」，不是从打开就倒计时 */
  setInterval(function(){
    if(done||finishing) return;
    if(!slow && Date.now()-lastAt>4000){ slow=true; label('网络较慢，已下载 '+mb(got)+' MB，仍在加载…'); }
  },500);

  function mount(html){
    finishing=true; fill.style.width='99%'; pct.textContent='99% · '+mb(got)+'/'+mb(total||got)+' MB';
    label('正在显示…');
    /* 把完整正文直接交给 iframe（不再二次下载）；补 base 让相对路径仍指向站点 */
    try{
      var base='<base href="'+location.origin+location.pathname+'">';
      html=html.replace(/<head([^>]*)>/i,'<head$1>'+base);
      html=html.replace(/<body([^>]*)>/i,'<body$1><script>window.__shellMounted=1<\/script>');
    }catch(e){}
    var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    var fr=document.createElement('iframe');
    fr.id='appframe'; fr.src=url;
    document.body.appendChild(fr);
    var t0=Date.now();
    fr.addEventListener('load',function(){
      footer();
    });
    function footer(){
      if(done) return; done=true;
      fill.style.width='100%'; pct.textContent='100%'; label('准备就绪');
      setTimeout(function(){
        splash.classList.add('hide');
        setTimeout(function(){ if(splash.parentNode) splash.remove(); },480);
      }, 600);
    }
    /* iframe 迟迟不来内容：8 秒后照样揭开，避免永远挡着 */
    setTimeout(function(){ if(!done && Date.now()-t0>8000) footer(); },8000);
  }

  async function run(){
    try{
      try{
        var v=await fetch('version.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();});
        if(v && v.s) total=Number(v.s)||0;
      }catch(e){}
      var res=await fetch('app.html?v='+VER);
      if(!res.ok) throw new Error('HTTP '+res.status);
      var cl=Number(res.headers.get('content-length')||0);
      if(cl) total=cl;
      if(!res.body || !res.body.getReader){
        var txt=await res.text(); got=txt.length; mount(txt); return;
      }
      var rd=res.body.getReader(), chunks=[], dec=new TextDecoder('utf-8');
      var buf='';
      label('正在下载…');
      while(true){
        var step=await rd.read();
        if(step.done) break;
        chunks.push(step.value); got+=step.value.length;
        lastAt=Date.now(); slow=false; label('正在下载…');
        paint();
      }
      label('正在解析…');
      for(var i=0;i<chunks.length;i++) buf+=dec.decode(chunks[i],{stream:true});
      buf+=dec.decode();
      paint();
      mount(buf);
    }catch(err){
      var off=!navigator.onLine;
      fail(off?'现在没有网络':'页面没加载出来',
           off?'连上网后点「重新加载」；也可以清缓存重启。':'启动资源没拿到（'+(err&&err.message?err.message.slice(0,40):'unknown')+'），点「重新加载」再试一次。');
    }
  }

  /* 外壳负责注册 SW：iframe 里是 blob 文档，注册不了；注册成功后才能离线缓存 app.html */
  try{
    var swOK=(location.protocol==='https:')||location.hostname==='localhost'||location.hostname==='127.0.0.1';
    if('serviceWorker' in navigator && swOK){
      navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
    }
  }catch(e){}

  window.addEventListener('error',function(e){ if(!finishing) fail('页面出错了','启动时遇到脚本错误，重开一次通常就好。'); });
  run();
})();
</script>
</body>
</html>
