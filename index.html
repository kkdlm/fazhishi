<style>
html,body{margin:0;padding:0;background:#EAEDE1}
:root{--zhu:#A5342E;--bamboo:#3C6B52;--ink:#151C17;--ink-3:#7C857A}
#upd{position:fixed;inset:0;z-index:10002;background-color:#EAEDE1;background-image:radial-gradient(rgba(96,124,102,.07) 1px,transparent 1px);display:none;align-items:center;justify-content:center;padding:24px}
#upd .splash-inner{animation:none}
#upd .splash-seal,#upd .splash-title,#upd .splash-sub,#upd .splash-strip,#upd .splash-slips i,#upd .sp-bar{animation:none!important;opacity:1!important}
#splash{position:fixed;inset:0;z-index:9999;background-color:#EAEDE1;background-image:radial-gradient(rgba(96,124,102,.07) 1px,transparent 1px);
  background-size:16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;
  transition:opacity .42s ease;font-family:"PingFang SC","HarmonyOS Sans SC",system-ui,-apple-system,sans-serif}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center}
.splash-slips{display:flex;gap:4px;margin-bottom:22px}
.splash-slips i{display:block;width:10px;height:66px;border-radius:3px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#E0D5B9,#CBBE9C);
  box-shadow:inset -1px 0 0 rgba(120,102,64,.28),inset 1px 0 0 rgba(255,250,236,.5),0 3px 8px -5px rgba(60,52,30,.6);
  transform-origin:top center;animation:slipIn .5s cubic-bezier(.2,.8,.3,1) both}
.splash-slips i:before{content:"";position:absolute;left:50%;top:7px;bottom:7px;width:1px;margin-left:-.5px;
  background:rgba(96,82,52,.3)}
.splash-slips i:after{content:"";position:absolute;left:2px;right:2px;top:26px;height:1px;
  background:rgba(96,82,52,.22)}
.splash-slips i:nth-child(1){animation-delay:.02s}
.splash-slips i:nth-child(2){animation-delay:.07s}
.splash-slips i:nth-child(3){animation-delay:.12s}
.splash-slips i:nth-child(4){animation-delay:.17s}
.splash-slips i:nth-child(5){animation-delay:.22s}
.splash-seal{width:84px;height:84px;border-radius:8px;background:var(--zhu);color:#FBF2E3;
  display:grid;place-items:center;font-size:46px;letter-spacing:2px;font-family:"Songti SC",serif;
  box-shadow:0 18px 38px -16px rgba(140,44,38,.7),inset 0 0 0 3px rgba(255,240,214,.24),inset 0 0 0 5px rgba(140,44,38,.9);
  animation:splashIn .62s cubic-bezier(.2,.7,.3,1) both}
.splash-title{margin:24px 0 9px;font-size:26px;letter-spacing:.16em;color:var(--ink);font-weight:600;font-family:"Songti SC",serif;
  animation:splashFade .42s ease both}
.splash-sub{margin:0;font-size:12.5px;letter-spacing:.1em;color:var(--ink-3);animation:splashFade .42s ease both}
.splash-strip{margin-top:22px;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.18em;
  color:var(--bamboo);opacity:.8;animation:splashFade .5s ease both}
.splash-strip s{display:block;width:26px;height:1px;background:var(--bamboo);opacity:.45;text-decoration:none}
.sp-bar{width:200px;max-width:62vw;height:3px;border-radius:99px;background:rgba(46,83,68,.15);margin-top:24px;overflow:hidden}
.sp-fill{height:100%;width:0%;border-radius:99px;background:var(--bamboo);transition:width .28s ease}
.sp-status{margin:12px 0 0;max-width:78vw;text-align:center;font-size:12.5px;line-height:1.55;letter-spacing:.06em;color:#4C5B50;min-height:17px;white-space:normal;word-break:break-word}
.sp-meta{margin:5px 0 0;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums;min-height:14px}
@keyframes slipIn{from{opacity:0;transform:scaleY(.12) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes splashIn{from{opacity:0;transform:rotate(-4deg) scale(.72)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
@keyframes splashFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash-seal,.splash-title,.splash-sub,.splash-slips i,.splash-strip{animation:none}}
#boot{position:fixed;inset:0;z-index:10001;background:#F6F5F0;color:#22302B;display:none;align-items:center;justify-content:center;
  font:16px/1.75 -apple-system,system-ui,sans-serif;padding:28px}
#boot .in{max-width:420px}
#boot h2{font-size:19px;margin:16px 0 8px}
#boot p{color:#5b6660;margin:0 0 6px}
#boot button{padding:12px 20px;border:0;border-radius:10px;background:#2C4A3E;color:#fff;font-size:15px;margin-top:10px}
#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#EAEDE1}
#upbar{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  z-index:10010;display:none;align-items:center;gap:8px;padding:9px 10px 9px 15px;border-radius:14px;
  background:rgba(28,48,40,.94);color:#F3F0E6;font-size:13px;letter-spacing:.02em;white-space:nowrap;
  box-shadow:0 16px 34px -16px rgba(0,0,0,.65);opacity:0;transition:opacity .3s ease,transform .3s ease}
#upbar.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#upbar b{font-weight:600;color:#FCEBC4}
#upbar a{color:#F3F0E6;text-decoration:none;font-weight:600;padding:5px 11px;border-radius:9px;
  background:rgba(255,255,255,.14);transition:background .2s}
#upbar a:active{background:rgba(255,255,255,.24)}
#upbar i{font-style:normal;font-size:16px;line-height:1;color:rgba(255,255,255,.45);padding:3px 5px}
</style>

<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-slips"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="splash-seal">史</div>
    <h1 class="splash-title">法制史一点通</h1>
    <p class="splash-sub">2027 法硕非法学 · <b style="color:var(--zhu);font-weight:600">169 条考点</b></p>
    <div class="splash-strip"><s></s>断代史 / 专题史 · 背诵一本通<s></s></div>
    <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    <p class="sp-status" id="spStatus">法制史正在进入大脑…</p>
    <p class="sp-meta" id="spPct"></p>
  </div>
</div>
<div id="upbar" aria-live="polite"><b>新版本已备好</b><a id="upgo" onclick="applyUpd()">重启生效</a><i id="upx" onclick="dismissUpd()">×</i></div>
<div id="boot"><div class="in">
  <div style="width:52px;height:52px;border-radius:9px;background:#B4483F;color:#FBF2E3;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600">史</div>
  <h2 id="bootT">页面没加载出来</h2>
  <p id="bootD"></p>
  <button onclick="location.reload()">重新加载</button>
  <button onclick="resetAll()" style="background:#fff;color:#2C4A3E;border:1px solid #C9D2C6;margin-left:8px">清缓存重启</button>
</div></div>
<script>
(function(){
  var VER='1.1.9.2', VERB='1.1.9.2';
  /* release 会把下面这个占位符替换成本次发布的 commit sha：
     有了它，jsDelivr 的 SHA 锚定线路在第一次尝试时就在队列里，不用等 version.json 回来。 */
  var RAW_SHA='da094dacaef3c46f03f0ad1aeee16f28b603a5cc';
  /* 缓存键只跟「正文版本」，不跟壳版本：
     这样以后只改壳（换线路、改文案）时，已在手机里的 6.5MB 正文照样命中，
     不会因为壳升级就逼所有人重下一遍。 */
  var KV=VERB;
  var fill=document.getElementById('spFill'),pct=document.getElementById('spPct'),
      status=document.getElementById('spStatus'),splash=document.getElementById('splash'),
      boot=document.getElementById('boot');
  var got=0,total=0,mounted=false,gate=0,done=false,finishing=false,slow=false,lastAt=Date.now(),retrying=false;
  var startAt=Date.now(), VIRT_MS=1500, P2_MS=1300, MIN_MS=3300;   /* 前 50% 走虚拟曲线，最少看 3.2 秒 */
  var shown=0, real=0, stallFrom=0;
  /* 总字节三级回退：本次响应头 / version.json / 上次成功下载的字节数 / 默认估值
     —— 任何一个取不到都不会让分母变 0，进度不会卡在 50% */
  var EXPECT=(function(){ try{ return Number(localStorage.getItem('fz_pkg')||0)||0; }catch(e){ return 0; } })();
  var FALLBACK=4.9*1048576;
  function denom(){ return total>0? total : (EXPECT>0? EXPECT : FALLBACK); }

  function mb(n){ return (n/1048576).toFixed(2); }
  function paint(){
    try{
      var dEl=document.getElementById('bootD');
      if(dEl && got>0 && denom()>0){
        if(got>=denom()*0.999) dEl.textContent='已取到 '+mb(got)+' MB · 正在打开';
        else if(!done) dEl.textContent='已下 '+mb(got)+' / '+mb(denom())+' MB · 还没下完，先别关页面';
      }
    }catch(e){}
    if(!isFinite(shown)||shown<0) shown=0;
    fill.style.width = shown.toFixed(1)+'%';
    var pi = Math.min(99, Math.floor(shown));   /* 100 只在真正揭开时给 */
    var size='';
    if(got>0){
      if(total>0 && got>=total) size=' · 已下载 '+mb(total)+' MB';
      else if(total>0) size=' · '+mb(got)+'/'+mb(total)+' MB';
      else size=' · 已下载 '+mb(got)+' MB';     /* 总量未知：只报已下载，绝不显示 /0 */
    }
    if(!got && !mounted && Date.now()-startAt>1600) size=' · 正在连接服务器…';
    pct.textContent = pi+'%'+size;
  }

  /* 台词：四句，够用不啰嗦，整行能显示完 */
  var LINES=[
    [0 ,'法制史正在进入大脑…'],
    [34,'一条条条文码进脑子里…'],
    [64,'别急，正在翻开书…'],
    [88,'书翻开了，马上开讲…']
  ];
  var lineIdx=-1;
  function label(){
    if(!got && !mounted){ status.textContent='还没收到数据，正在换线路…'; lineIdx=-1; return; }
    if(slow){ var t='网络较慢，还在下载'; if(total>0) t+='（'+mb(got)+'/'+mb(total)+' MB）'; t+='…'; status.textContent=t; lineIdx=-1; return; }
    var i=0;
    for(var k=0;k<LINES.length;k++){ if(shown>=LINES[k][0]) i=k; }
    if(i!==lineIdx){ lineIdx=i; status.textContent=LINES[i][1]; }
  }

  function virtualPct(t){
    if(t>=VIRT_MS) return 50;
    var x=t/VIRT_MS; return 50*(1-Math.pow(1-x,2.6));
  }

  function tick(){
    if(done) return;
    var now=Date.now();
    var vt=virtualPct(now-startAt);
    var rt=50+49*Math.min(1,real);          /* 真实字节映射到 50→99 */
    /* 前 1.5 秒只走虚拟曲线（0→50）；之后时间曲线推到 99，但不能跑在真实字节前面 */
    var p2=Math.min(1, Math.max(0, (now-startAt-VIRT_MS)/(P2_MS)));
    var timePhase=50+49*(1-Math.pow(1-p2,1.7));
    var want = vt<50 ? vt : Math.min(Math.max(50,timePhase), Math.max(50,rt));
    /* 真断流（连续 1.2 秒没有任何新字节）才在当前位置缓慢往上爬，最多到 92；
       只要还在收到数据就不爬，避免「只下了 0.02MB 就冲到 92%」的假进度 */
    if(!mounted && now-lastAt>1200 && shown<90){
      if(!stallFrom) stallFrom=Math.max(50,shown);          /* 断流起点固定，避免越算越快地滚雪球 */
      var creep=stallFrom+Math.min(38,(now-lastAt-1200)/1000*4);
      if(creep>want) want=Math.min(creep,90);
    }else if(now-lastAt<=1200){ stallFrom=0; }
    /* 一个字节都没收到时，进度封在 46%，不再自己往上爬——那会让人以为快好了其实卡死 */
    if(!got && !mounted) want=Math.min(want,46);
    if(!isFinite(want)) want=50;
    if(mounted){
      var left=startAt+MIN_MS-now;
      if(left>420) want=Math.min(want,99);                       /* 没到收尾就最多停在 99 */
      else want=Math.max(want,99.6);                             /* 最后半拍补到 100 */
    }
    var d=want-shown;
    if(d>0){ var step=Math.min(1.1, Math.max(0.3, d*0.12)); shown=Math.min(want, shown+step); }
    paint(); label();
    if(mounted && shown>=99.6 && now-startAt>=MIN_MS){ reveal(); return; }
    requestAnimationFrame(tick);
  }

  function reveal(){
    if(done) return; done=true;
    shown=100; fill.style.width='100%'; pct.textContent='100%'+(total>0?' · 已下载 '+mb(total)+' MB':''); status.textContent='准备就绪，进去背吧';
    splash.classList.add('hide');
    setTimeout(function(){ if(splash.parentNode) splash.remove(); },480);
  }

  /* 邀请码：只认 FZ + 6 位 */
  var INV=(function(){
    try{
      var v=(new URLSearchParams(location.search||'')).get('inv')||'';
      v=v.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      return /^FZ[A-Z0-9]{6}$/.test(v)?v:'';
    }catch(e){ return ''; }
  })();

  /* 正文挂载：优先 blob: iframe（快、隔离好）；微信 / QQ 内置浏览器（X5 内核）会拦 blob: iframe，
     表现是「进度走完、一片空白」，所以这里读 iframe 里有没有内容，2.6 秒还是空的就改成直接写文档。 */
  function patchHTML(html){
    try{
      var base='<base href="'+location.origin+location.pathname+'">';
      html=html.replace(/<head([^>]*)>/i,'<head$1>'+base);
      /* 邀请链接：?inv=FZxxxxxx，把码直接送进正文（正文跑在 iframe 里，读不到地址栏 query） */
      html=html.replace(/<body([^>]*)>/i,'<body$1><script>window.__indexMounted=1;window.__FZ_INV="'+INV+'";<\/script>');
    }catch(e){}
    return html;
  }
  function frameHas(fr){
    try{
      var d=fr&&fr.contentDocument;
      if(!d||!d.body) return false;
      return d.body.children.length>0 || (d.body.textContent||'').replace(/\s/g,'').length>0;
    }catch(e){ return false; }
  }
  function newFrame(){
    var fr=document.createElement('iframe');
    fr.id='appframe';
    document.body.appendChild(fr);
    return fr;
  }
  function writeDoc(fr,html){
    try{ var d=fr&&fr.contentDocument; if(!d) return false; d.open(); d.write(html); d.close(); return true; }catch(e){ return false; }
  }
  function mountFail(){
    mounted=true; done=true;
    try{ if(splash&&splash.parentNode) splash.classList.add('hide'); }catch(e){}
    try{
      var b=document.getElementById('boot'); if(!b) return;
      b.style.display='flex';
      var t=document.getElementById('bootT'), dd=document.getElementById('bootD');
      if(t) t.textContent='内容没能显示出来';
      if(dd) dd.textContent='这个浏览器拦住了页面装载（微信 / QQ 内置浏览器常见）。点「重新加载」再试一次，或点右上角 ··· 选「在浏览器中打开」。';
      var btn=b.querySelector('button'); if(btn) btn.textContent='重新加载';
    }catch(e){}
  }
  function loadInto(html, cb){
    var fr=newFrame(), settled=false, t0=Date.now(), iv=null, iv2=null;
    function pass(){ if(settled) return; settled=true; if(iv) clearInterval(iv); if(iv2) clearInterval(iv2); cb(true); }
    function fail(){ if(settled) return; settled=true; if(iv) clearInterval(iv); if(iv2) clearInterval(iv2); cb(false); }
    try{ fr.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})); }catch(e){}
    try{ fr.addEventListener('load',function(){ if(frameHas(fr)) pass(); }); }catch(e){}
    function rewrite(){
      /* blob 被拦：换成直接写这个 iframe 的文档（同源 about:blank，X5 也认） */
      var ok=writeDoc(fr,html);
      if(!ok){
        try{ fr.remove(); }catch(e){}
        fr=newFrame(); ok=writeDoc(fr,html);
      }
      var t1=Date.now();
      if(frameHas(fr)){ pass(); return; }
      iv2=setInterval(function(){
        if(frameHas(fr)){ pass(); return; }
        if(Date.now()-t1>2600){ fail(); }
      },120);
    }
    iv=setInterval(function(){
      if(frameHas(fr)){ pass(); return; }
      if(Date.now()-t0>2600){ clearInterval(iv); rewrite(); }
    },120);
  }
  function mount(html){
    finishing=true; gate=Date.now()+420; real=1;
    try{ status.textContent='内容到手，正在拆封…'; }catch(e){}
    boot.style.display='none';   /* 下载断流时弹的提示，真正挂载成功后收起 */
    loadInto(patchHTML(html), function(ok){
      if(ok){ mounted=true; gate=Math.max(gate,Date.now()+150); }
      else mountFail();
    });
  }

  /* 正文只下一次：拉到的正文存进本机缓存，之后打开、重启、断电重来都直接读本机，
     不再重下 6.5MB。缓存按版本号分键：版本没变秒开；版本变了先秒开旧版，后台悄悄换新版。 */
  var PKGC='fz-pkg';
  function pkgURL(ver){ return location.origin+'/__fz_pkg__/'+encodeURIComponent(ver); }
  async function pkgSave(ver,html){
    try{
      if(!window.caches||!html||html.length<500000) return;
      var c=await caches.open(PKGC), ks=await c.keys(), keep=pkgURL(ver), i;
      await c.put(new Request(keep,{cache:'no-store'}), new Response(html,{headers:{'content-type':'text/html;charset=utf-8'}}));
      var back=await c.match(new Request(keep,{cache:'no-store'}));
      var blen=back?(await back.text()).length:0;
      if(blen<html.length*0.98) throw new Error('缓存只写进 '+blen+'/'+html.length);
      for(i=0;i<ks.length;i++){ if(ks[i].url!==keep){ try{ await c.delete(ks[i]); }catch(e){} } }
    }catch(e){}
  }
  async function pkgLoad(){
    try{
      if(!window.caches) return null;
      var c=await caches.open(PKGC), ks=await c.keys();
      if(!ks.length) return null;
      var r=await c.match(ks[0]); if(!r) return null;
      var html=await r.text(); if(!html||html.length<500000) return null;
      var m=/__fz_pkg__\/([^\/]*)$/.exec(ks[0].url);
      return {ver:m?decodeURIComponent(m[1]):'', html:html};
    }catch(e){ return null; }
  }
  /* 本机已有正文：启动画面照放，但只放 1.1 秒——够看清「史」印和简牍展开，
     又不会像以前那样一进来就把启动页掐掉（看着像没有启动画面）。 */
  function quick(html){
    finishing=true; real=1; shown=0; done=true;   /* done 先占位，tick 不再插手指进度 */
    var t0=Date.now(), MINQ=1100, ivq=null;
    try{ fill.style.width='0%'; pct.textContent=''; status.textContent='书已在手边，正在翻开…'; }catch(e){}
    boot.style.display='none';
    mount(html);
    ivq=setInterval(function(){
      var el=Date.now()-t0;
      var p=Math.min(99.6, el/MINQ*99.6);
      try{ fill.style.width=p.toFixed(1)+'%'; pct.textContent=Math.floor(p)+'%'; }catch(e){}
      /* 正文真的挂上了、动画也放完了，才淡出启动页，避免中间露白 */
      if(el>=MINQ && mounted || el>2600){   /* 装载失败也别把启动页吊死在那儿 */
        clearInterval(ivq);
        shown=100;
        try{ fill.style.width='100%'; pct.textContent='100%'; status.textContent=''; }catch(e){}
        try{ splash.classList.add('hide'); setTimeout(function(){ if(splash.parentNode) splash.remove(); },460); }catch(e){}
      }
    },50);
  }
  function showUpd(){ try{ document.getElementById('upbar').classList.add('on'); }catch(e){} }
  window.dismissUpd=function(){ try{ document.getElementById('upbar').classList.remove('on'); }catch(e){} };
  window.applyUpd=function(){ try{ var b=document.getElementById('upbar'); if(b) b.classList.remove('on'); }catch(e){}; hardReload(); };
  /* 后台静默换新版：不等它，下好就写进缓存，页面上提示一下「重启生效」，不打断当前阅读 */
  async function bgPull(){
    try{
      var html=await pullOne('app.html?v='+VER, 9000, 30000, 0.15);
      await pkgSave(KV, html);
      showUpd();
    }catch(e){}
  }
  /* 「清缓存重启」按钮原本点不动（函数没挂到 window），这里补上 */
  window.resetAll=async function(){
    try{ var rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){ return r.unregister(); })); }catch(e){}
    try{ var ks=await caches.keys(); await Promise.all(ks.map(function(k){ return caches.delete(k); })); }catch(e){}
    try{ localStorage.removeItem('fz_pkg'); }catch(e){}
    location.replace(location.pathname+'?r='+Date.now());
  };

  /* 备用线路：主站拉不动（0 字节、超时、被墙）时换镜像。
     两个镜像都返回 Access-Control-Allow-Origin: *，可以直接 fetch 读取正文。 */
  /* 实测（国内出口）：GitHub Pages 首字节 15.7 秒、1.4KB/s，基本没法用；
     gcore.jsdelivr 1.8 秒起、1.8MB/s，raw.githubusercontent 0.9 秒起、4.6MB/s。
     所以镜像在前、本站放最后兜底；真正选哪条由下面的竞速决定。 */
  /* 实测（同一出口、同一时刻）：
       raw.githubusercontent  首字节 0.9s、4.6MB/s、6.5MB 约 1.4 秒下完
       GitHub Pages          首字节 2–16s、20–500KB/s、25 秒都下不完
       jsDelivr(@main)       速度尚可但缓存的是上一版正文，校验会被拒，白跑一趟
     所以：raw 优先，Pages 兜底；jsDelivr 不再使用。 */
  /* 发版直链（CDN，国内可直连）：优先级最高，内容与当前版本一致才用 */
  var APPCDN='https://aka.doubaocdn.com/s/CLZdr0nqOw';

  var MIRRORS=[
    'https://raw.githubusercontent.com/kkdlm/fazhishi/main/app.html'
  ];

  /* 线路竞速：同时向几条线路各要 2 个字节，谁先回就用谁。
     以前是一条条串行试，本站 8 秒 + 三条镜像各 8 秒，四条都慢就要干等半分钟，
     表现就是「进度停在 0.00 MB、卡很久」。现在最迟 3.5 秒必出结果。 */
  async function pickFast(urls, ms){
    var t0=Date.now(), ctls=[];
    return await new Promise(function(resolve){
      var done=false, fin=setTimeout(function(){
        if(done) return; done=true;
        try{ ctls.forEach(function(c){ try{ c.abort(); }catch(e){} }); }catch(e){}
        resolve({list:urls.slice(), fastest:0});
      }, ms);
      function kill(){ try{ ctls.forEach(function(c){ try{ c.abort(); }catch(e){} }); }catch(e){} }
      urls.forEach(function(u){
        var ctl=null; try{ ctl=new AbortController(); ctls.push(ctl); }catch(e){}
        try{
          fetch(u,{signal:ctl?ctl.signal:undefined, cache:'no-store'}).then(function(r){
            if(done || !r || r.status>=400) return;
            done=true; clearTimeout(fin); kill();
            resolve({list:[u].concat(urls.filter(function(x){return x!==u;})), fastest:Date.now()-t0});
          }).catch(function(){});
        }catch(e){}
      });
    });
  }

  /* 拉一条件：首字节 firstByteMs 内没来就 abort；已经有字节但 12 秒还不到 15%，也 abort（换更快的线路） */
  async function pullOne(url, firstByteMs, stallMs, hardMs){
    var ctl=null, tid=null, st=null, first=false, t0=Date.now(), chunks=[], dec=new TextDecoder('utf-8'), buf='', res, rd, step, cl;
    lastAt=Date.now();
    try{ if(window.AbortController) ctl=new AbortController(); }catch(e){}
    if(ctl && firstByteMs){ tid=setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, firstByteMs); }
    if(ctl && stallMs){
      st=setInterval(function(){
        try{
          if(done || finishing) return;
          var idle=Date.now()-lastAt;                 /* 距上次收到字节多久 */
          var d=total||denom(); var prog=d>0?(got/d):0;
          /* 越接近下完越耐心：已经 85% 以上就多等一会儿，别在最后一段把线路切掉重下 */
          var allowance=stallMs*(prog>0.85?3.2:(prog>0.6?1.8:1));
          if(idle>=allowance && got<d*0.995){ try{ window.__fzStall={got:got,total:d,idle:idle}; }catch(e){} ctl.abort(); return; }
          if(hardMs && Date.now()-t0>=hardMs) ctl.abort();
        }catch(e){}
      },1000);
    }
    try{
      res=await fetch(url, ctl?{signal:ctl.signal,cache:'default'}:{cache:'default'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      cl=Number(res.headers.get('content-length')||0);
      /* 压缩传输时 CDN 报的是压缩后长度（约一半），不能直接当总量；
         与 version.json 的字节数差得离谱就忽略它，宁可不用这个分母 */
      if(cl>0 && (!total || Math.abs(cl-total)<total*0.35)) total=cl;
      if(!res.body || !res.body.getReader){
        buf=await res.text(); got=buf.length; real=1;
        if(got<1000) throw new Error('内容为空');
        return buf;
      }
      rd=res.body.getReader();
      while(true){
        step=await rd.read();
        if(step.done) break;
        if(!first){ first=true; if(tid){ clearTimeout(tid); tid=null; } }
        chunks.push(step.value); got+=step.value.length;
        lastAt=Date.now(); slow=false;
        var r=got/denom();
        if(!isFinite(r)||r<0) r=0;
        r=Math.min(0.985,r);
        if(r>real) real=r;                        /* 只进不退 */
      }
      for(var i=0;i<chunks.length;i++) buf+=dec.decode(chunks[i],{stream:true});
      buf+=dec.decode();
      real=1;
      if(got<1000) throw new Error('内容为空');
      /* 流被提前截断（服务端断开）时不能当成功挂载，否则进去就是白屏 */
      if(total>0 && got < total*0.85) throw new Error('下载不完整 '+mb(got)+'/'+mb(total)+' MB');
      try{ localStorage.setItem('fz_pkg', String(got)); }catch(e){}
      return buf;
    } finally { if(tid){ clearTimeout(tid); tid=null; } if(st){ clearInterval(st); st=null; } }
  }

  /* 拿到 version.json 里的 commit sha 后，才把 jsDelivr 的「sha 锚定」线路插到第 2 位：
     用 sha 而不是 @main，就不会像 @main 那样给你上一版正文。谁先回来顺序都可能变，所以做成幂等。 */
  var RTLIST=null;
  function jdURL(sha){ return 'https://cdn.jsdelivr.net/gh/kkdlm/fazhishi@'+sha+'/app.html'; }
  function tryJd(){
    try{
      if(!window.__fzSha) return;
      var jd=jdURL(window.__fzSha);
      if(RTLIST && RTLIST.indexOf(jd)<0) RTLIST.splice(1,0,jd);
      else window.__fzJd=jd;
    }catch(e){}
  }

  async function run(){
    var lastErr=null, round, i;
    try{
      /* ① 本机已有正文 → 直接秒开。版本不一致就先开旧版，同时在后台换新版 */
      var pk=await pkgLoad();
      if(pk && pk.html){
        quick(pk.html);
        if(pk.ver!==KV) bgPull();
        return;
      }
      /* 版本信息只用来算进度分母，不必等它：和正文同时开跑，回来了再补上总量 */
      fetch('version.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();})
        .then(function(v){
          if(v&&v.s) total=Number(v.s)||0;
          if(v&&v.sha){ window.__fzSha=v.sha; tryJd(); }
        }).catch(function(){});
      /* ① 本站：地址只随版本号变化（不带时间戳），所以浏览器缓存能命中——第二次打开不再重拉 6.5MB；
         ② 首字节 8 秒没来就换镜像，不死等；③ 三条都失败再整体重试一轮 */
      RTLIST=MIRRORS.concat(['app.html?v='+VER]);
      if(APPCDN) RTLIST.unshift(APPCDN);
      window.__fzSha='';
      /* 国内（尤其中华人民共和国境内手机网络）直连 raw.githubusercontent 常见超时，
         Pages 又只有 20–500KB/s（6.5MB 要几十秒到几分钟）。
         所以加两条转发热线垫在中间：
           gh-proxy  → Cloudflare 反代 raw，内容永远是最新 main，带 CORS
           jsDelivr  → 用 commit SHA 锚定（不吃 @main 的 24 小时缓存滞后），带 CORS
         两条都给的是同一份正文，版本号/补丁号校验过不了照样被拒，不会进旧版。 */
      RTLIST.splice(2,0,'https://gh-proxy.com/https://raw.githubusercontent.com/kkdlm/fazhishi/main/app.html');
      if(RAW_SHA && RAW_SHA.indexOf('__')<0) RTLIST.splice(1,0,jdURL(RAW_SHA));
      if(window.__fzSha) tryJd();
      /* 按实测速度排好的顺序试；首字节 4.5 秒不来、或 12 秒还不到 15%，立刻换下一条。
         不再做「竞速」：首字节快不等于下得快，会挑到吞吐只有 100KB/s 的线路，反而更慢。 */
      status.textContent='正在获取正文…';
      for(round=0; round<2; round++){
        for(i=0;i<RTLIST.length;i++){
          if(done) return;
          got=0; real=0; lastAt=Date.now();
          try{
            boot.style.display='none';
            var html=await pullOne(RTLIST[i], round?8000:6000, 7000, 150000);
            /* 镜像可能缓存着上一版（jsDelivr 的 @main 有缓存）：版本/补丁对不上一律当这条线路失败，换下一条 */
            if(html.indexOf("const VER='"+VERB+"'")<0)
              throw new Error('这条线路给的是旧版本');
            /* 先落盘再挂载：以前是挂上去再异步存，用户一进来就切走会把 6.5MB 写入打断，
               下次打开又得从头下——表现就是「每次都很慢、进度停在 0」。 */
            try{ await pkgSave(KV, html); }catch(e){}
            mount(html);
            return;
          }catch(e){
            lastErr=e;
            if(!done && !finishing && i<RTLIST.length-1){
              var sg=window.__fzStall;
              status.textContent = (sg && sg.got>0)
                ? ('这条线卡住了（已下 '+mb(sg.got)+(sg.total>0?('/'+mb(sg.total)+' MB'):' MB')+'），换一条接着下…')
                : '这条线路太慢，换一条再试…';
            }
          }
          if(!navigator.onLine) throw (lastErr||new Error('现在没有网络'));
        }
        if(!navigator.onLine) break;
        retrying=true;
        await new Promise(function(s){ setTimeout(s, round?2400:1200); });
        retrying=false;
      }
      throw lastErr||new Error('所有线路都没拿到内容');
    }catch(err){
      var off=!navigator.onLine;
      boot.style.display='flex';
      document.getElementById('bootT').textContent=off?'现在没有网络':'页面没加载出来';
      document.getElementById('bootD').textContent=off?'连上网后点「重新加载」；也可以清缓存重启。'
        :'几条线路都没拿到正文（'+(err&&err.message?err.message.slice(0,40):'unknown')+'），点「重新加载」再试一次。';
    }finally{ retrying=false; }
  }

  setInterval(function(){
    if(done||finishing) return;
    if(!slow && Date.now()-lastAt>4000){ slow=true; }
    if(Date.now()-lastAt>25000 && !mounted && !window.__booted){
      boot.style.display='flex';
      document.getElementById('bootT').textContent='还连不上，正在换线路重试';
      document.getElementById('bootD').textContent='已经拿到 '+(got>0?mb(got)+' MB':'0 MB')+'。会自动换镜像再试；等太久可以点「清缓存重启」。';
    }
  },500);

  /* 正文在 iframe（blob）里跑，它自己跳转会拿到 blob 地址；重启交给外壳 */
  /* 更新：先在外壳层清 SW 与缓存，再硬跳到带版本参数的地址（SW 见 ?v= 会跳过缓存） */
  async function hardReload(){
    try{ var rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){return r.unregister();})); }catch(err){}
    /* 只换壳（40KB 的 index 走新地址），正文那 6.5MB 已经在缓存里，重启后直接秒开 */
    location.replace(location.pathname+'?v='+Date.now());
  }
  window.addEventListener('message',function(e){
    try{
      if(e && e.data && (e.data.t==='fz-restart'||e.data.t==='fz-reload')){
        /* 重开时只显示和启动页同一套画面，绝不闪“加载失败/超时”那种错误卡片 */
        boot.style.display='none';
        try{
          var up=document.getElementById('upd');
          if(!up){
            up=document.createElement('div'); up.id='upd';
            up.innerHTML='<div class="splash-inner"><div class="splash-slips"><i></i><i></i><i></i><i></i><i></i></div>'
              +'<div class="splash-seal">史</div><h1 class="splash-title">法制史一点通</h1>'
              +'<p class="splash-sub">正在应用更新</p>'
              +'<div class="sp-bar"><div class="sp-fill" style="width:100%"></div></div>'
              +'<p class="sp-status">清理缓存，重新翻开书…</p></div>';
            document.body.appendChild(up);
          }
          up.style.display='flex';
        }catch(x){}
        setTimeout(hardReload,80);
      }
    }catch(err){}
  });
  try{
    var swOK=(location.protocol==='https:')||location.hostname==='localhost'||location.hostname==='127.0.0.1';
    if('serviceWorker' in navigator && swOK){ navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){}); }
  }catch(e){}

  window.addEventListener('error',function(){ if(!finishing && Date.now()-startAt>1500){ boot.style.display='flex'; document.getElementById('bootT').textContent='页面出错了'; document.getElementById('bootD').textContent='启动时遇到脚本错误，重开一次通常就好。'; } });
  paint();
  requestAnimationFrame(tick);
  run();
})();
</script>
</body>
</html>
